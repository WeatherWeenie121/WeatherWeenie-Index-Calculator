<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Low-Level Environment Index</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1220;color:#e5e7eb;margin:0;padding:24px}
.container{max-width:760px;margin:auto;background:#111827;padding:24px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.35)}
h1{margin-top:0;font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column}.field label{margin-bottom:6px;font-weight:bold}.field input{padding:10px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff}button{margin-top:18px;padding:12px 18px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}button:hover{opacity:.95}.meter{height:28px;background:#1f2937;border-radius:999px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);transition:width .4s}.result{font-size:24px;font-weight:bold}.small{color:#9ca3af}.table{margin-top:16px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1f2937}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Storm Low-Level Environment Index</h1>
<p class="small">Inputs: 3 km CAPE, 0–1 km vorticity, ML CIN, critical angle.</p>
<div class="grid">
<div class="field"><label>C (3 km CAPE)</label><input id="c" type="number" value="150"></div>
<div class="field"><label>V (0–1 km vorticity)</label><input id="v" type="number" value="300"></div>
<div class="field"><label>N (ML CIN, negative)</label><input id="n" type="number" value="-40"></div>
<div class="field"><label>A (critical angle)</label><input id="a" type="number" value="70"></div>
</div>
<button onclick="calc()">Calculate Index</button>
<div class="meter"><div class="fill" id="fill"></div></div>
<div class="result">Index: <span id="score">--</span> / 10</div>
<div id="label"></div>
<div class="table">
<div class="row"><span>CAPE Score</span><span id="sc">--</span></div>
<div class="row"><span>Vorticity Score</span><span id="sv">--</span></div>
<div class="row"><span>CIN Score</span><span id="sn">--</span></div>
<div class="row"><span>Angle Score</span><span id="sa">--</span></div>
</div>
<p class="small">Formula uses clamped component scores from 0 to 10.</p>
</div>
<script>
function clamp(x){return Math.max(0,Math.min(10,x));}
function calc(){
 const C=parseFloat(document.getElementById('c').value)||0;
 const V=parseFloat(document.getElementById('v').value)||0;
 const N=parseFloat(document.getElementById('n').value)||0;
 const A=parseFloat(document.getElementById('a').value)||0;
 const sC=clamp(10*(C-25)/175);
 const sV=clamp(10*(V-100)/400);
 const sN=clamp(10*(1-Math.abs(N)/100));
 const sA=clamp(10*(1-Math.abs(A-60)/40));
 const idx=(sC+sV+sN+sA)/4;
 document.getElementById('sc').textContent=sC.toFixed(2);
 document.getElementById('sv').textContent=sV.toFixed(2);
 document.getElementById('sn').textContent=sN.toFixed(2);
 document.getElementById('sa').textContent=sA.toFixed(2);
 document.getElementById('score').textContent=idx.toFixed(2);
 document.getElementById('fill').style.width=(idx*10)+'%';
 let txt='';
 if(idx<2) txt='Poor / hostile low-level environment';
 else if(idx<4) txt='Marginal';
 else if(idx<6) txt='Modestly supportive';
 else if(idx<8) txt='Favorable';
 else txt='Highly favorable low-level environment';
 document.getElementById('label').textContent=txt;
}
calc();
</script>
</body>
</html>
